<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="210mm" height="297mm" viewBox="0 0 210 297" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Gradient for modern look -->
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BCD4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0097A7;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00BCD4;stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:#00BCD4;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#00BCD4;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="210" height="297" fill="#FFFFFF"/>
  
  <!-- Top decorative banner -->
  <rect x="0" y="0" width="210" height="60" fill="url(#headerGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="190" cy="20" r="8" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="175" cy="45" r="5" fill="#FFFFFF" opacity="0.2"/>
  <circle cx="20" cy="35" r="6" fill="#FFFFFF" opacity="0.25"/>
  
  <!-- Organization Logo/Name -->
  <text x="105" y="28" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    SOS Children's Village
  </text>
  
  <!-- Tagline -->
  <text x="105" y="45" font-family="Arial, sans-serif" font-size="5.5" fill="#FFFFFF" text-anchor="middle" opacity="0.9">
    EMPOWERING YOUTH THROUGH EDUCATION
  </text>
  
  <!-- Workshop Title Container -->
  <rect x="20" y="80" width="170" height="50" fill="url(#accentGradient)" rx="3"/>
  
  <!-- Workshop Title -->
  <text x="105" y="100" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#00838F" text-anchor="middle" letter-spacing="2">
    PUBLIC SPEAKING
  </text>
  
  <text x="105" y="118" font-family="Arial, sans-serif" font-size="9" fill="#00838F" text-anchor="middle" font-style="italic">
    Workshop
  </text>
  
  <!-- Decorative line -->
  <line x1="40" y1="145" x2="170" y2="145" stroke="#00BCD4" stroke-width="0.5" opacity="0.5"/>
  
  <!-- Details Section -->
  <!-- Date Icon and Info -->
  <g id="date-section">
    <rect x="30" y="165" width="60" height="35" fill="#F0F9FA" rx="2"/>
    <circle cx="45" cy="178" r="6" fill="#00BCD4"/>
    <text x="45" y="180.5" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      28
    </text>
    <text x="56" y="177" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#00838F">
      28 January
    </text>
    <text x="56" y="187" font-family="Arial, sans-serif" font-size="5" fill="#00838F">
      Tuesday
    </text>
  </g>
  
  <!-- Time Icon and Info -->
  <g id="time-section">
    <rect x="100" y="165" width="50" height="35" fill="#F0F9FA" rx="2"/>
    <circle cx="113" cy="178" r="6" fill="#00BCD4"/>
    <line x1="113" y1="178" x2="113" y2="174" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/>
    <line x1="113" y1="178" x2="116" y2="178" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/>
    <text x="123" y="179" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#00838F">
      9:00 AM
    </text>
    <text x="123" y="189" font-family="Arial, sans-serif" font-size="4.5" fill="#00838F">
      Morning
    </text>
  </g>
  
  <!-- Location Icon and Info -->
  <g id="location-section">
    <rect x="30" y="210" width="150" height="35" fill="#F0F9FA" rx="2"/>
    <circle cx="45" cy="227.5" r="6" fill="#00BCD4"/>
    <path d="M 45 224 L 45 231 M 42 227.5 L 48 227.5" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/>
    <circle cx="45" cy="227.5" r="3" fill="none" stroke="#FFFFFF" stroke-width="0.8"/>
    <text x="56" y="226" font-family="Arial, sans-serif" font-size="6" fill="#00838F" font-weight="bold">
      LOCATION
    </text>
    <text x="56" y="235" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#00838F">
      IPSI
    </text>
  </g>
  
  <!-- Description Box -->
  <rect x="30" y="255" width="150" height="20" fill="#FFFFFF" stroke="#00BCD4" stroke-width="0.5" rx="2"/>
  <text x="105" y="264" font-family="Arial, sans-serif" font-size="5" fill="#00838F" text-anchor="middle">
    Enhance your communication skills and
  </text>
  <text x="105" y="270" font-family="Arial, sans-serif" font-size="5" fill="#00838F" text-anchor="middle">
    build confidence in public speaking
  </text>
  
  <!-- Bottom decorative element -->
  <rect x="0" y="287" width="210" height="10" fill="url(#headerGradient)"/>
  
  <!-- Contact/Footer -->
  <text x="105" y="293.5" font-family="Arial, sans-serif" font-size="4" fill="#FFFFFF" text-anchor="middle">
    Join us for an inspiring session • All are welcome
  </text>
</svg>
