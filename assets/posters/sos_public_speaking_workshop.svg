<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="210mm"
   height="297mm"
   viewBox="0 0 210 297"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&amp;display=swap');
      .title { font-family: 'Montserrat', sans-serif; font-weight: 800; fill: #ffffff; }
      .subtitle { font-family: 'Montserrat', sans-serif; font-weight: 600; fill: #ffffff; }
      .info-label { font-family: 'Montserrat', sans-serif; font-weight: 600; fill: #00bcd4; }
      .info-text { font-family: 'Montserrat', sans-serif; font-weight: 700; fill: #333333; }
      .org-name { font-family: 'Montserrat', sans-serif; font-weight: 700; fill: #00bcd4; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="210" height="297" fill="#ffffff"/>
  
  <!-- Header Section with Cyan Background -->
  <rect x="0" y="0" width="210" height="120" fill="#00bcd4"/>
  
  <!-- Decorative Elements -->
  <circle cx="195" cy="15" r="25" fill="#ffffff" opacity="0.15"/>
  <circle cx="15" cy="105" r="20" fill="#ffffff" opacity="0.15"/>
  <circle cx="180" cy="95" r="15" fill="#ffffff" opacity="0.2"/>
  
  <!-- Organization Name -->
  <text x="105" y="35" text-anchor="middle" class="org-name" style="font-size: 10px; fill: #ffffff; letter-spacing: 1px;">SOS CHILDREN'S VILLAGE</text>
  
  <!-- Workshop Title -->
  <text x="105" y="70" text-anchor="middle" class="title" style="font-size: 32px; letter-spacing: 2px;">PUBLIC</text>
  <text x="105" y="100" text-anchor="middle" class="title" style="font-size: 32px; letter-spacing: 2px;">SPEAKING</text>
  
  <!-- Workshop Label -->
  <text x="105" y="115" text-anchor="middle" class="subtitle" style="font-size: 8px; fill: #ffffff; letter-spacing: 3px; opacity: 0.9;">WORKSHOP</text>
  
  <!-- Information Cards Section -->
  <!-- Date Card -->
  <g id="date-card">
    <rect x="30" y="150" width="150" height="35" rx="5" fill="#f0f9fa" stroke="#00bcd4" stroke-width="0.5"/>
    <text x="45" y="163" class="info-label" style="font-size: 7px; letter-spacing: 1px;">DATE</text>
    <text x="45" y="177" class="info-text" style="font-size: 16px;">28 January</text>
  </g>
  
  <!-- Time Card -->
  <g id="time-card">
    <rect x="30" y="195" width="150" height="35" rx="5" fill="#f0f9fa" stroke="#00bcd4" stroke-width="0.5"/>
    <text x="45" y="208" class="info-label" style="font-size: 7px; letter-spacing: 1px;">TIME</text>
    <text x="45" y="222" class="info-text" style="font-size: 16px;">9:00 AM</text>
  </g>
  
  <!-- Location Card -->
  <g id="location-card">
    <rect x="30" y="240" width="150" height="35" rx="5" fill="#f0f9fa" stroke="#00bcd4" stroke-width="0.5"/>
    <text x="45" y="253" class="info-label" style="font-size: 7px; letter-spacing: 1px;">LOCATION</text>
    <text x="45" y="267" class="info-text" style="font-size: 16px;">IPSI</text>
  </g>
  
  <!-- Bottom decorative section -->
  <rect x="0" y="285" width="210" height="12" fill="#00bcd4"/>
  
  <!-- Microphone Icon (simplified) -->
  <g id="microphone-icon" transform="translate(95, 130)">
    <ellipse cx="10" cy="5" rx="4" ry="6" fill="none" stroke="#00bcd4" stroke-width="1.5"/>
    <line x1="10" y1="11" x2="10" y2="17" stroke="#00bcd4" stroke-width="1.5"/>
    <line x1="6" y1="17" x2="14" y2="17" stroke="#00bcd4" stroke-width="1.5"/>
    <path d="M 6,8 Q 6,14 10,14 Q 14,14 14,8" fill="none" stroke="#00bcd4" stroke-width="1.2"/>
  </g>
</svg>
